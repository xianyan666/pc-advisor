# 服务器配置
server:
  port: 8080 # 端口号
  servlet:
    context-path: / # 上下文路径

# Spring配置
spring:
  # 数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/pcadvisor?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root # 替换为你的数据库用户名
    password: 748005 # 替换为你的数据库密码
  # 文件上传
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

# 日志配置
logging:
  level:
    com.pcadvisor.mapper: debug # 打印MyBatis SQL日志
    com.pcadvisor: info

# MyBatis-Plus配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true # 下划线转驼峰
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl # 打印SQL到控制台
  global-config:
    db-config:
      id-type: auto # 主键自增
